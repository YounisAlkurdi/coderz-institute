<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>الاستفسار - معهد Coderz</title>
    </head>

    <body>
       
        <header>
            <nav>
                <a href="../index.html">الرئيسية</a>
                <a href="schedule.html">المواعيد</a>
                <a href="inquiry.html"> الاستفسار</a>
            </nav>
        </header>
        <main>
        <section>
            <h2>استفسارات عن دورات</h2>
            <p>لديك أسئلة حول دوراتنا أو أي شيء آخر؟ لا تتردد في التواصل معنا!</p>

            <form action="#" method="post">
                <label for="full-name">الاسم كامل :</label>
                <input type="text" id="full-name" name="full_name" placeholder="مثال : احمد محمد" autocomplete="name" required /><br><br>

                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required autocomplete="email" /><br><br>

                <label for="phone">رقم الهاتف :</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" required /><br><br>

                <label for="course">الكورس</label>
                <select id="course" name="course" required>
                    <option value="">اختر الكورس</option>
                    <option value="html-content">HTML Content</option>
                    <option value="html-form">HTML Form</option>
                </select><br><br>

                <label for="seats">عدد مقاعد :</label>
                <input type="number" id="seats" name="seats" value="1" min="1" required /><br><br>

                <label for="pr-date">التاريخ المفضل :</label>
                <input type="date" id="pr-date" name="date" required /><br><br>
                <label for="message">نص الاستفسار  :</label><br>
                <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
                <input type="submit" value="إرسال الاستفسار" />
        </section>
        </main>
    </body>
</html>
